text><text x="160" y="134" class="step-title">Ask before retrying</text><text x="160" y="170" class="body">Arca.Client looks up 42 with FECompConsultar, as ARCA&#x27;s manual prescribes for</text><text x="160" y="197" class="body">communication errors.</text></g><g style="animation: h19 16.799999999999997s linear infinite; opacity: 0;"><rect x="56" y="98" width="76" height="76" rx="10" class="num-box"/><text x="94" y="149" class="num" text-anchor="middle">6</text><text x="160" y="134" class="step-title">The CAE, recovered</text><text x="160" y="170" class="body">42 exists with the same amounts and receiver: the invoice is approved with its</text><text x="160" y="197" class="body">CAE, nothing duplicated.</text></g>

"packet-text" fill="#ffb648">42</text></g><g class="packet" style="animation: p4 16.799999999999997s linear infinite;"><rect x="-43.8" y="-13" width="87.6" height="26" rx="13" fill="#171c22" stroke="#6fd08c" stroke-width="1.6"/><circle cx="-30.799999999999997" cy="0" r="4" fill="#6fd08c"/><text x="-20.799999999999997" y="4.5" class="packet-text" fill="#6fd08c">42 · CAE</text></g><g style="animation: b5 16.799999999999997s linear infinite; opacity: 0;"><rect x="300.0" y="455" width="170.0" height="32" rx="6" fill="#171c22" stroke="#ec6a5e" stroke-width="1.2"/><text x="385.0" y="471" class="badge-text" fill="#ec6a5e" text-anchor="middle">connection dropped</text></g><g style="animation: b6 16.799999999999997s linear infinite; opacity: 0;"><rect x="955.0" y="477" width="130.0" height="32" rx="6" fill="#171c22" stroke="#6fd08c" stroke-width="1.2"/><text x="1020.0" y="493" class="badge-text" fill="#6fd08c" text-anchor="middle">42 authorized</text></g><g style="animation: c7 16.799999999999997s linear infinite; opacity: 0;" class="cut"><circle cx="385" cy="395" r="15" fill="#171c22" stroke="#ec6a5e" stroke-width="2"/><path d="M379,389 L391,401 M391,389 L379,401" stroke="#ec6a5e" stroke-width="2.4"/></g><g class="packet" style="animation: p8 16.799999999999997s linear infinite;"><rect x="-43.8" y="-13" width="87.6" height="26" rx="13" fill="#171c22" stroke="#ec6a5e" stroke-width="1.6"/><circle cx="-30.799999999999997" cy="0" r="4" fill="#ec6a5e"/><text x="-20.799999999999997" y="4.5" class="packet-text" fill="#ec6a5e">42 again</text></g><g style="animation: b9 16.799999999999997s linear infinite; opacity: 0;"><rect x="495.0" y="477" width="210.0" height="32" rx="6" fill="#171c22" stroke="#ec6a5e" stroke-width="1.2"/><text x="600.0" y="493" class="badge-text" fill="#ec6a5e" text-anchor="middle">10016: not the next one</text></g><g class="packet" style="animation: p10 16.799999999999997s linear infinite;"><rect x="-84.8" y="-13" width="169.6" height="26" rx="13" fill="#171c2
